# ARM64 feature mapping for cpu_features.h generation.
# Format:
#   <feature-name> <HWCAP|HWCAP2> <bit-index> <compiler-macro-or-->
#   arch=<arch-name> <base-arch-or-<>> [comma,separated,extra,features]

fp      HWCAP   0   __ARM_FP
asimd   HWCAP   1   __ARM_NEON
aes     HWCAP   3   __ARM_FEATURE_AES
pmull   HWCAP   4   __ARM_FEATURE_CRYPTO
sha1    HWCAP   5   __ARM_FEATURE_CRYPTO
sha2    HWCAP   6   __ARM_FEATURE_SHA2
crc32   HWCAP   7   __ARM_FEATURE_CRC32
sve     HWCAP   22  __ARM_FEATURE_SVE
sve2    HWCAP2  1   __ARM_FEATURE_SVE2

arch=armv8_crc_crypto <> fp,asimd,crc32,aes,pmull,sha1,sha2
arch=armv8_neon_crc_crypto armv8_crc_crypto
arch=armv9_sve <> fp,asimd,sve
arch=armv9_sve2 armv9_sve sve2

# x86 architecture name aliases for dual-arch (x86 + ARM64) port.
# These make cpu_skylake_avx512 / cpu_haswell symbols defined in the
# ARM64-generated cpu_features.h, so test sources that reference these x86
# constants (e.g. eigen_svd_cdouble, ipsec _avx/_avx512 variants) compile
# unchanged on ARM64. Both alias to armv8_crc_crypto (Kunpeng 920 satisfies it,
# so the tests run rather than skip). The arm64_architectures[] runtime array
# dedups identical-signature arches, so these x86 names never appear in
# "Detected CPU:" output. The native x86 build is unaffected (uses simd.conf).
arch=Haswell           armv8_crc_crypto  alias
arch=Skylake-Avx512    armv8_crc_crypto  alias
